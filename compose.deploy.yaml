x-jsb1-logging: &jsb1-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    image: ${JSB1_DEPLOY_BACKEND_IMAGE:?set JSB1_DEPLOY_BACKEND_IMAGE}
    build:
      context: ${JSB1_BUILD_CONTEXT:?set JSB1_BUILD_CONTEXT}
      dockerfile: ${JSB1_DEPLOY_BACKEND_DOCKERFILE:?set JSB1_DEPLOY_BACKEND_DOCKERFILE}
      labels:
        net.mangagaki.jsb1.deployment-image: "true"
        net.mangagaki.jsb1.branch-slug: ${JSB1_DEPLOY_SLUG:?set JSB1_DEPLOY_SLUG}
    environment:
      JSB1_DATA_DIR: /data
      JSB1_DATABASE_PATH: /data/jsb1.db
      JSB_SIM_RUNNER_PATH: jsb-sim-runner
      JSB_SCENARIO_DIR: /scenarios
      JSB1_REPOSITORY_ROOT: /data/repositories
      JSB0_REPOSITORY_URL: ${JSB0_REPOSITORY_URL:-https://github.com/egod1537/jsb0.git}
      JSB0_REPOSITORY_PATH: /runtime/jsb0
      JSB0_DEFAULT_BRANCH: ${JSB0_DEFAULT_BRANCH:-impl}
      JSB1_SCENARIO_SFTP_HOST: ${JSB1_SCENARIO_SFTP_HOST:-}
      JSB1_SCENARIO_SFTP_PORT: ${JSB1_SCENARIO_SFTP_PORT:-22}
      JSB1_SCENARIO_SFTP_USER: ${JSB1_SCENARIO_SFTP_USER:-}
      JSB1_SCENARIO_SFTP_ROOT: ${JSB1_SCENARIO_SFTP_ROOT:-/}
      JSB1_SCENARIO_SFTP_KEY_PATH: ${JSB1_SCENARIO_SFTP_CONTAINER_KEY_PATH:-}
      JSB1_SCENARIO_SFTP_PASSWORD: ${JSB1_SCENARIO_SFTP_PASSWORD:-}
      JSB1_SCENARIO_SFTP_KNOWN_HOSTS_PATH: ${JSB1_SCENARIO_SFTP_CONTAINER_KNOWN_HOSTS_PATH:-}
      JSB1_SCENARIO_SFTP_TIMEOUT_SEC: ${JSB1_SCENARIO_SFTP_TIMEOUT_SEC:-15}
      JSB1_WORKTREE_ROOT: /data/worktrees
      JSB1_BUILD_ROOT: /data/builds
      JSB1_DEPLOYMENT_ROOT: /data/deployments
      JSB1_MAX_CONCURRENT_RUNS: "1"
      JSB1_EXECUTION_MODE: external
      JSB1_RUN_TIMEOUT_SEC: "1800"
      JSB1_CORS_ORIGINS: '[]'
      JSB1_DEPLOY_BRANCH: ${JSB1_DEPLOY_BRANCH:?set JSB1_DEPLOY_BRANCH}
      JSB1_DEPLOY_COMMIT: ${JSB1_DEPLOY_COMMIT:?set JSB1_DEPLOY_COMMIT}
      JSB1_DEPLOY_BUILT_AT: ${JSB1_DEPLOY_BUILT_AT:?set JSB1_DEPLOY_BUILT_AT}
      JSB1_DEPLOY_HOSTNAME: ${JSB1_DEPLOY_HOSTNAME:?set JSB1_DEPLOY_HOSTNAME}
    volumes:
      - type: bind
        source: ${JSB1_DEPLOY_DATA_DIR:?set JSB1_DEPLOY_DATA_DIR}
        target: /data
      - type: bind
        source: ${JSB1_SCENARIO_DIR:?set JSB1_SCENARIO_DIR}
        target: /scenarios
        read_only: true
      - type: bind
        source: ${JSB0_REPOSITORY_PATH:?set JSB0_REPOSITORY_PATH}
        target: /runtime/jsb0
      - type: bind
        source: ${JSB1_SCENARIO_SFTP_KEY_PATH:-/dev/null}
        target: /run/secrets/jsb1-scenario-sftp-key
        read_only: true
      - type: bind
        source: ${JSB1_SCENARIO_SFTP_KNOWN_HOSTS_PATH:-/dev/null}
        target: /run/secrets/jsb1-scenario-known-hosts
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    labels:
      net.mangagaki.jsb1.branch-slug: ${JSB1_DEPLOY_SLUG:?set JSB1_DEPLOY_SLUG}
      net.mangagaki.jsb1.branch: ${JSB1_DEPLOY_BRANCH:?set JSB1_DEPLOY_BRANCH}
      net.mangagaki.jsb1.commit: ${JSB1_DEPLOY_COMMIT:?set JSB1_DEPLOY_COMMIT}
      net.mangagaki.jsb1.built-at: ${JSB1_DEPLOY_BUILT_AT:?set JSB1_DEPLOY_BUILT_AT}
    logging: *jsb1-logging
    restart: unless-stopped

  worker:
    image: ${JSB1_DEPLOY_BACKEND_IMAGE:?set JSB1_DEPLOY_BACKEND_IMAGE}
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      JSB1_DATA_DIR: /data
      JSB1_DATABASE_PATH: /data/jsb1.db
      JSB_SIM_RUNNER_PATH: jsb-sim-runner
      JSB1_REPOSITORY_ROOT: /data/repositories
      JSB0_REPOSITORY_URL: ${JSB0_REPOSITORY_URL:-https://github.com/egod1537/jsb0.git}
      JSB0_REPOSITORY_PATH: /runtime/jsb0
      JSB0_DEFAULT_BRANCH: ${JSB0_DEFAULT_BRANCH:-impl}
      JSB1_WORKTREE_ROOT: /data/worktrees
      JSB1_BUILD_ROOT: /data/builds
      JSB1_MAX_CONCURRENT_RUNS: "1"
      JSB1_RUN_TIMEOUT_SEC: "1800"
    volumes:
      - type: bind
        source: ${JSB1_DEPLOY_DATA_DIR:?set JSB1_DEPLOY_DATA_DIR}
        target: /data
      - type: bind
        source: ${JSB0_REPOSITORY_PATH:?set JSB0_REPOSITORY_PATH}
        target: /runtime/jsb0
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 2s
    labels:
      net.mangagaki.jsb1.branch-slug: ${JSB1_DEPLOY_SLUG:?set JSB1_DEPLOY_SLUG}
      net.mangagaki.jsb1.role: execution-worker
    logging: *jsb1-logging
    restart: unless-stopped

  web:
    build:
      context: ${JSB1_BUILD_CONTEXT}
      dockerfile: ${JSB1_DEPLOY_FRONTEND_DOCKERFILE:?set JSB1_DEPLOY_FRONTEND_DOCKERFILE}
      additional_contexts:
        deploy-config: ${JSB1_DEPLOY_CONFIG_CONTEXT:?set JSB1_DEPLOY_CONFIG_CONTEXT}
      args:
        VITE_JSB1_BRANCH: ${JSB1_DEPLOY_BRANCH:?set JSB1_DEPLOY_BRANCH}
        VITE_JSB1_COMMIT: ${JSB1_DEPLOY_COMMIT:?set JSB1_DEPLOY_COMMIT}
        VITE_JSB1_BUILD_TIME: ${JSB1_DEPLOY_BUILT_AT:?set JSB1_DEPLOY_BUILT_AT}
        VITE_JSB1_HOSTNAME: ${JSB1_DEPLOY_HOSTNAME:?set JSB1_DEPLOY_HOSTNAME}
      labels:
        net.mangagaki.jsb1.deployment-image: "true"
        net.mangagaki.jsb1.branch-slug: ${JSB1_DEPLOY_SLUG}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JSB1_DEPLOY_PORT:?set JSB1_DEPLOY_PORT}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/api/health
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    labels:
      net.mangagaki.jsb1.branch-slug: ${JSB1_DEPLOY_SLUG}
      net.mangagaki.jsb1.branch: ${JSB1_DEPLOY_BRANCH}
      net.mangagaki.jsb1.commit: ${JSB1_DEPLOY_COMMIT}
      net.mangagaki.jsb1.built-at: ${JSB1_DEPLOY_BUILT_AT}
      net.mangagaki.jsb1.hostname: ${JSB1_DEPLOY_HOSTNAME:?set JSB1_DEPLOY_HOSTNAME}
    logging: *jsb1-logging
    restart: unless-stopped
