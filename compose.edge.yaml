x-jsb1-logging: &jsb1-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  edge:
    image: caddy:2.10-alpine
    command: ["caddy", "run", "--config", "/etc/caddy/jsb-config/Caddyfile", "--adapter", "caddyfile"]
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${JSB1_EDGE_HTTP_PORT:-80}:80"
      - "127.0.0.1:${JSB1_EDGE_HTTPS_PORT:-4443}:443"
    volumes:
      # Bind the stable directory rather than one file. Docker Desktop can keep
      # a stale inode for a file bind when Git replaces that file atomically.
      - ./deploy:/etc/caddy/jsb-config:ro
      - type: bind
        source: ${JSB1_CADDY_ROUTES_DIR:?set JSB1_CADDY_ROUTES_DIR}
        target: /etc/caddy/routes
        read_only: true
      - type: bind
        source: ${JSB1_TLS_CERT_PATH:-/Users/yang/.cloudflare/jsb-origin.pem}
        target: /etc/caddy/tls/jsb-origin.pem
        read_only: true
      - type: bind
        source: ${JSB1_TLS_KEY_PATH:-/Users/yang/.cloudflare/jsb-origin.key}
        target: /etc/caddy/tls/jsb-origin.key
        read_only: true
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/jsb-config/Caddyfile", "--adapter", "caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *jsb1-logging
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2026.8.2
    command:
      - --config
      - /etc/cloudflared/config.yml
      - tunnel
      - run
    depends_on:
      edge:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${JSB1_CLOUDFLARED_CONFIG_PATH:?set JSB1_CLOUDFLARED_CONFIG_PATH}
        target: /etc/cloudflared/config.yml
        read_only: true
      - type: bind
        source: ${JSB1_CLOUDFLARED_CREDENTIALS:?set JSB1_CLOUDFLARED_CREDENTIALS}
        target: /etc/cloudflared/credentials.json
        read_only: true
    logging: *jsb1-logging
    restart: unless-stopped

volumes:
  edge-data:
  edge-config:
