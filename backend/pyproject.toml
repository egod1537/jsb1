[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jsb1-backend"
version = "0.1.0"
description = "JSB1 simulation regression and analysis server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "jsb1-analysis==0.1.0",
  "mcap>=1.2,<2",
  "mcap-protobuf-support>=0.5,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "paramiko>=3.5,<5",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "uvicorn[standard]>=0.32,<1",
]

[tool.uv.sources]
jsb1-analysis = { path = "../analysis", editable = true }

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
